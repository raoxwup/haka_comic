[package]
name = "rust_lib_haka_comic"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
hex = "0.4.3"
hmac = "0.12.1"
human-sort = "0.2.2"
image = "0.25.10"
rayon = "1.12.0"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
walkdir = "2.5.0"
zip = "8.6.0"

[profile.release]
opt-level = 3
strip = true
lto = true
panic = "abort"
codegen-units = 1
